# Geliştirme için Postgres, Redis ve MinIO (S3 uyumlu medya deposu): docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oneclick
      POSTGRES_PASSWORD: oneclick
      POSTGRES_DB: oneclick
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneclick"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Yerel S3: medya dosyaları "oneclick" bucket'ında. Konsol: http://localhost:9001 (oneclick / oneclick-secret)
  # Resmi minio/minio imajı artık yayınlanmıyor; pgsty/minio bakımı süren topluluk çatalıdır (mc dahil)
  minio:
    image: &minio-image pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oneclick
      MINIO_ROOT_PASSWORD: oneclick-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  # Bucket'ı oluşturur ve herkese okunur yapar (panel ve platformlar medyayı doğrudan buradan çeker)
  minio-init:
    image: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 oneclick oneclick-secret &&
      mc mb --ignore-existing local/oneclick &&
      mc anonymous set download local/oneclick
      "
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:
