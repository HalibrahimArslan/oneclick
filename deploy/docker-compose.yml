# Production kurulumu. deploy/ klasöründe:
#   ./setup-env.sh            (ilk kez: .env oluşturur)
#   docker compose up -d --build
name: oneclick-prod

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: oneclick:latest
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    PORT: "4000"
    DATABASE_URL: postgresql://oneclick:${POSTGRES_PASSWORD}@postgres:5432/oneclick
    REDIS_URL: redis://valkey:6379
    WEB_URL: https://${APP_DOMAIN}
    API_PUBLIC_URL: https://${APP_DOMAIN}
    PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-https://${APP_DOMAIN}/media}
    TRUST_PROXY: "true"
  volumes:
    - uploads:/app/apps/api/uploads
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy

services:
  api:
    <<: *app
    # Açılışta bekleyen veritabanı migration'larını uygular
    command: sh -c "pnpm exec prisma migrate deploy && node dist/main.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *app
    command: node dist/worker.js
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oneclick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: oneclick
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneclick"]
      interval: 5s
      retries: 20

  # Redis ile birebir uyumlu, BSD lisanslı (Linux Foundation)
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  valkeydata:
  uploads:
  caddy_data:
  caddy_config:
